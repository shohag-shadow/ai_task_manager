<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Task Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  .chat-scroll { scrollbar-width: thin; }
</style>
</head>
<body class="h-full bg-slate-50 text-slate-800">

<div class="h-full max-w-7xl mx-auto p-4 flex flex-col">
  <header class="mb-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold">🧠 AI Task Manager</h1>
    <span class="text-xs text-slate-500">Chat is the primary control</span>
  </header>

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-5 gap-4 min-h-0">

    <!-- Chat panel -->
    <section class="lg:col-span-3 bg-white rounded-xl shadow flex flex-col min-h-0">
      <div id="messages" class="flex-1 overflow-y-auto chat-scroll p-4 space-y-3"></div>
      <form id="chat-form" class="border-t p-3 flex gap-2">
        <input id="chat-input" type="text" autocomplete="off"
          placeholder="e.g. Create a high-priority task to finish the demo tomorrow"
          class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <button id="send-btn" type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium disabled:opacity-50">
          Send
        </button>
      </form>
    </section>

    <!-- Task list -->
    <section class="lg:col-span-2 bg-white rounded-xl shadow flex flex-col min-h-0">
      <div class="p-3 border-b flex items-center justify-between">
        <h2 class="font-semibold">Tasks</h2>
        <button id="refresh-btn" class="text-xs text-indigo-600 hover:underline">Refresh</button>
      </div>
      <div id="tasks" class="flex-1 overflow-y-auto chat-scroll p-3 space-y-2"></div>
    </section>
  </div>
</div>

<script src="/app.js"></script>

</body>
</html>
